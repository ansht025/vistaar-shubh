services:
  # 1. FastAPI Python Backend
  - type: web
    name: vistaar-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    domains:
      - api.vistaarwater.in
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vistaar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://vistaarwater.in
      - key: FRONTEND_URLS
        value: https://vistaarwater.in,https://www.vistaarwater.in,https://studio.vistaarwater.in
      # Placeholders for SMTP settings (sync: false allows manual edits in Render dashboard without overrides)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. React Vite Frontend (Static Site)
  - type: static
    name: vistaar-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    domains:
      - vistaarwater.in
      - www.vistaarwater.in
    routes:
      # Rewrite API requests to the Python Backend
      - type: rewrite
        source: /api/*
        destination: https://api.vistaarwater.in/api/*
      # Rewrite static assets served by Python backend
      - type: rewrite
        source: /static/*
        destination: https://api.vistaarwater.in/static/*
      # Single Page Application (SPA) fallback to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_ORIGIN
        value: https://api.vistaarwater.in
      - key: VITE_STUDIO_EDITOR_URL
        value: https://studio.vistaarwater.in/editor
      - key: VITE_STUDIO_DASHBOARD_URL
        value: https://studio.vistaarwater.in/dashboard

  # 3. Next.js Studio Portal (Node Web Service)
  - type: web
    name: vistaar-studio
    env: node
    rootDir: studio-next
    buildCommand: npm install && npm run build
    startCommand: npm run start
    domains:
      - studio.vistaarwater.in
    envVars:
      - key: NEXT_PUBLIC_MAIN_SITE_URL
        value: https://vistaarwater.in
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://api.vistaarwater.in
      - key: PORT
        value: "3000"

# 4. Shared PostgreSQL Database (Free tier)
databases:
  - name: vistaar-db
    plan: free
